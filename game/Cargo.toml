[package]
name = "bavovniatko"
version = "0.1.0"
edition = "2024"
description = "Vuhledar, 6 February 2023: the first diorama of bavovniatko"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bevy = { version = "=0.19.1", features = ["wayland", "jpeg"] }
rand = { version = "0.9", features = ["small_rng"] }
strum = { version = "0.28.0", features = ["derive"] }
# The ground chunks as PNGs (the version Bevy's own image loading uses).
image = { version = "0.25", default-features = false, features = ["png"] }

# Fast iteration: optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Bevy systems and spawn helpers take many parameters by design.
[lints.clippy]
too_many_arguments = "allow"
