# The game's workspace, in layers: bav-core (geometry, layouts, the dioramas, words, switches, the frame's order),
# bav-sim (the battle, deterministic) on it, bav-look (picture and sound, which read the battle) on both, and the
# game (bavovniatko: camera, HUD, development and showcase) on top. tools/bake is a workspace of its own.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/bavovniatko"]
exclude = ["tools/bake"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bav-core = { path = "crates/core" }
bav-sim = { path = "crates/sim" }
bav-look = { path = "crates/look" }
bevy = { version = "=0.19.1", features = ["wayland", "jpeg"] }
rand = { version = "0.9", features = ["small_rng"] }
strum = { version = "0.28.0", features = ["derive"] }
# The dioramas' data files (the versions Bevy already depends on).
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# RON laid out as the dioramas are (game/fmt.ron): the library, without its command line.
fmtron = { version = "1.0.0-rc.2", default-features = false }
# The ground chunks as PNGs (the version Bevy's own image loading uses).
image = { version = "0.25", default-features = false, features = ["png"] }

# A Bevy system that needs many parameters groups them into `#[derive(SystemParam)]` structs named for what they
# are (the camera's state, the HUD's texts), and a plain helper that would take many arguments takes a struct
# instead. The lint is denied so the grouping stays that way.
[workspace.lints.clippy]
too_many_arguments = "deny"

# Fast iteration: optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What ships, and what the same-day and the showcase film: one codegen unit and thin LTO.
[profile.release]
codegen-units = 1
lto = "thin"

# Test shots, clips and balance runs: release speed at a fraction of the build time. Not for same-day or the
# film, which compare against release builds.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
