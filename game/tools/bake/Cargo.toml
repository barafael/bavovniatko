[package]
name = "bake"
version = "0.1.0"
edition = "2024"
description = "Bakes the downloaded vehicle models into the game's compact .veh files"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
gltf = { version = "1.4", features = ["import", "names", "KHR_materials_pbrSpecularGlossiness"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
meshopt = "0.6"
