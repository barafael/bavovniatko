# Terrain profiles for the procedural map generator, derived from cited claims.
# One profile per OSM sample box (10 x 10 km each, OSM Overpass 2026-09-28, Microsoft building footprints
# 2026-02-03, Sentinel-2 cloudless 2021 check), plus `seasons` and `battle_damage`.
# Conventions:
#   - `measured` holds the claimed statistics as reported; `dist` is the sampling distribution for the generator,
#     spanning the measured values. Where a box has no measurement, `dist` falls back to pooled claims and says so.
#   - OSM completeness caveats (06-0027-*): about two-thirds of Sentinel-2-visible belts are mapped in the best
#     boxes, so OSM belt densities are lower bounds and OSM spacings upper bounds; farmland polygons sometimes
#     split one belt block, biasing field sizes low; OSM buildings are 1-18% complete, so buildings come from
#     Microsoft footprints.
#   - Belt form (rows, gaps, height) and settlement shape are only claimed pooled across boxes; each box
#     carries the pooled values.
terrain:

- key: pokrovsk_w
  place: place:pokrovsk_w_box
  description: "West of Pokrovsk (Donetsk oblast), bbox S,W,N,E 48.22, 36.8325, 48.31, 36.9675. Open farmland with belts following field edges; belts almost unmapped in OSM, so belt spacing falls back to pooled values."
  params:
    main_belt_spacing_m:
      measured: {available: false, note: "too few belts mapped in OSM; Sentinel-2 detector noisy"}
      dist: {type: triangular, min: 300, mode: 549, max: 990}
      fallback: "pooled: Parfonov's 300-400 m (min) and the Huliaipole E reference grid (median 549, p90 990)"
    cross_belt_spacing_m:
      measured: {available: false}
      dist: {type: triangular, min: 1000, mode: 1200, max: 2000}
      fallback: "pooled: Parfonov 1,000-2,000 m; Huliaipole E imagery 1.1-1.3 km"
    belt_canopy_width_m: {measured: {osm_median: 27}, dist: {type: point, value: 27}}
    belt_stem_width_m: {dist: {type: point, value: 12.4}, note: "0.46 x canopy width (forester conversion factor)"}
    belt_rows: {dist: {type: uniform, min: 3, max: 4}, note: pooled (Parfonov)}
    belt_gap_width_m: {dist: {type: uniform, min: 10, max: 30}, note: "machinery gaps, pooled (Parfonov)"}
    belt_height_m: {dist: {type: uniform, min: 19.6, max: 23.4}, note: pooled mature belts}
    belt_density_km_per_km2: {measured: {osm_mapped: 0.28}, note: "severe lower bound; belts exist as gaps between farmland polygons"}
    belt_orientation_shares:
      dist:
        type: table
        table: [{axis_deg: 160, label: NNW-SSE, share: 0.68}, {axis_deg: null, label: other, share: 0.32}]
      note: share of belt length within +-20 deg of the axis
    field_block_m:
      measured: {mbr_median_short: 625, mbr_median_long: 1348}
      dist: {type: table, table: {short: 625, long: 1348}}
    field_aspect_ratio:
      measured: {p10: 1.2, median: 2.0, p90: 4.3}
      dist: {type: triangular, min: 1.2, mode: 2.0, max: 4.3}
    field_area_ha:
      measured: {n: 78, p10: 15, median: 65, p90: 172}
      dist: {type: triangular, min: 15, mode: 65, max: 172}
    median_field_area_ha: 65
    track_density_km_per_km2: {measured: 0.55, dist: {type: point, value: 0.55}}
    paved_road_density_km_per_km2: {measured: 0.13, dist: {type: point, value: 0.13}, note: "OSM primary-tertiary"}
    settlement_density_per_100km2: {measured: 8, dist: {type: point, value: 8}, note: "clusters of >=20 Microsoft footprint buildings"}
    building_density_per_100km2: {measured: 2758}
    settlement_elongation:
      small: {dist: {type: triangular, min: 1.8, mode: 4.1, max: 10.6}, median_size_buildings: 71, median_dims_m: [755, 254]}
      large: {dist: {type: point, value: 2.3}, median_size_buildings: 595, median_dims_m: [2200, 1000]}
      small_share: 0.77
      note: "pooled across the five boxes (33 small, 10 large settlements); small <300 buildings"
    farmland_share: {measured: 0.67, dist: {type: point, value: 0.67}}
    osm_building_completeness: 0.018
  derived_from: [06-0024-01, 06-0025-01, 06-0025-06, 06-0025-11, 06-0025-20, 06-0025-25, 06-0025-30, 06-0025-35, 06-0025-40, 06-0025-45, 06-0025-50, 06-0027-01, 06-0009-09, 06-0025-14, 06-0026-02, 06-0009-01, 06-0009-02, 06-0009-03, 06-0009-05, 06-0009-08, 06-0019-10, 06-0019-12, 06-0023-01, 06-0023-02, 06-0023-03, 06-0023-04, 06-0023-05]
  method: "Box statistics from 06 section 2.7 (OSM + Microsoft footprints). Belt spacing unmeasurable here, so the Huliaipole E reference grid and Parfonov's front-line grid are used as a fallback. small_share = 33/43 settlements (derived)."
  attribution: "© OpenStreetMap contributors (ODbL); derived statistics"

