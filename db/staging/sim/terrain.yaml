- key: seasons
  description: "Seasonal and weather conditions and their qualitative effects on ground mobility, concealment and drones. Claims give no numeric multipliers except where stated; the game should map levels to its own modifiers."
  params:
    table:
      - condition: spring_thaw
        months: [3, 4]
        ground_mobility: "fields impassable ('liquid earth' chernozem over frozen subsoil); off-road vehicles stop, heavy traffic keeps to paved roads; infantry and quads keep moving but slowed"
        foliage_visibility: "leafless belts, little cover"
        drone_modifiers: "belts give little concealment"
        claims: [06-0029-01, 06-0029-02, 06-0013-17]
      - condition: late_spring
        months: [4, 5]
        ground_mobility: "ground hardens; mechanised assaults resumed near Pokrovsk by mid-April 2025"
        foliage_visibility: "foliage expanding"
        drone_modifiers: "concealment rising along treelines"
        tactical: "infiltration along treelines rises; defenders prepare treelines before the leaves come in; Russia used new foliage for foot, motorcycle and quad-bike moves in spring 2026"
        claims: [06-0029-03, 06-0029-04, 06-0029-05, 06-0011-04]
      - condition: summer
        months: [6, 7, 8, 9]
        ground_mobility: "dry and firm (dust likely, unsourced)"
        foliage_visibility: "full canopy"
        drone_modifiers: "leaves hide treeline positions from drones and precision fires; canopy 'substantially degrades' FPV effectiveness"
        claims: [06-0029-06, 06-0029-07, 06-0011-07, 06-0011-08, 06-0011-09]
      - condition: autumn
        months: [10, 11]
        ground_mobility: "autumn rasputitsa; armies shift to the defensive (Nov 2023)"
        foliage_visibility: "leaf-fall exposes positions"
        drone_modifiers: "detection rises"
        claims: [06-0029-08, 06-0029-09, 06-0011-07, 06-0004-02]
      - condition: winter_snow
        months: [12, 1, 2]
        ground_mobility: "frozen ground (to -20 C in 2026)"
        foliage_visibility: "bare dark treelines stand out against snow"
        drone_modifiers: "tracks in snow lead drones to positions; movement on snow readily detected"
        tactical: "white ponchos, single-file movement"
        claims: [06-0029-10, 06-0029-11, 06-0029-12, 06-0029-13, 06-0038-50]
      - condition: winter_no_snow
        months: [12, 1, 2]
        ground_mobility: "frozen or wet"
        foliage_visibility: "everything grey; bare branches expose both sides"
        drone_modifiers: "camouflage patterns harder to match"
        claims: [06-0029-14, 06-0011-09]
      - condition: winter_wind
        months: [12, 1, 2, 3]
        ground_mobility: "blown soil moves mainly in this period (dust effect)"
        foliage_visibility: "leafless belts more permeable"
        claims: [06-0029-15]
      - condition: fog
        months: any
        ground_mobility: unchanged
        foliage_visibility: "drones blinded"
        drone_modifiers: "drones grounded; infiltration and reinforcement window"
        tactical: "Avdiivka Nov 2023; Pokrovsk Feb and Aug 2025; more than 300 Russian troops got inside Pokrovsk in thick fog on 7-12 Nov 2025"
        claims: [06-0029-16, 06-0029-17, 06-0029-18, 06-0029-19]
      - condition: night_and_cold
        months: any
        foliage_visibility: "thermal imaging dominates, more effective in the cold"
        drone_modifiers: "thermal detection bonus; troops use thermal ponchos and heated batteries"
        claims: [06-0029-20, 06-0029-21]
      - condition: rain_and_frost
        months: any
        ground_mobility: "mud (see thaw/autumn)"
        drone_modifiers: "light quadcopters (Mavic class) and FPVs degraded, with 'substantial losses' of Mavics near Kupiansk (Dec 2024); wet weather disadvantaged light FPVs at Pokrovsk (2025)"
