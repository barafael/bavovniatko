# Simulation parameters derived from cited claims (phase 8 game feed).
# Conventions:
#   - Only claimed numbers are used. Where claims give ranges or disagree, a uniform or triangular distribution
#     spans them and `method` names who says what. "Derived" values are simple arithmetic on claimed numbers
#     (e.g. a monthly count divided by days in the month) and are labelled as such.
#   - Eras without evidence are skipped, not guessed.
#   - side = the side the parameter describes (ua: Ukrainian forces or Ukrainian air defence; ru: Russian forces).
#   - interception rates are Ukrainian air defence against Russian weapons (side ua).
params:

# ---------------------------------------------------------------- kill zone / observation
- key: kill_zone_depth
  era: e1
  dist: {type: point, value: 0}
  unit: km
  description: No continuous drone kill zone in the invasion era; fighting was road ambushes against BTG columns.
  derived_from: [05-0028-01]
  method: "RUSI (via 05's era table): 'no continuous kill zone', ambushes along roads; encoded as 0 km so the game disables the band."

- key: kill_zone_depth
  era: e2
  dist: {type: uniform, min: 20, max: 40}
  unit: km
  description: Fires kill zone in the Donbas artillery era, set by drone-cued artillery range rather than by drones striking directly.
  derived_from: [05-0028-03]
  method: "RUSI: artillery range, about 20-40 km; HIMARS reaches 80-85 km (deep-strike layer, not part of this band)."

- key: kill_zone_depth
  era: e3
  dist: {type: uniform, min: 20, max: 40}
  unit: km
  description: Fires kill zone in the 2022 counteroffensives, unchanged from e2 (artillery range), plus HQ displacement.
  derived_from: [05-0028-05]
  method: "Same 20-40 km artillery-range band as e2 per 05's era table; no drone-lethal depth claimed for e3."

- key: kill_zone_depth
  era: e6
  dist: {type: point, value: 3}
  unit: km
  description: Drone-lethal band in the Avdiivka attrition era, roughly the zone of full visibility, with a growing FPV threat.
  derived_from: [05-0028-10, 01-0018-15, 02-0025-05]
  method: "RUSI 2024 fieldwork: full visibility within about 3 km; Russian FPV reach was about 3 km before growing to 10 km by spring 2025."

- key: kill_zone_depth
  era: e7
  dist: {type: triangular, min: 3, mode: 10, max: 15}
  unit: km
  description: Drone-lethal band in the Kursk-Pokrovsk era, growing from the 3 km full-visibility zone toward 10-15 km.
  derived_from: [05-0028-12, 05-0021-01, 00-0058-01, 02-0025-05, 01-0022-03, 08-0014-13]
  method: "RUSI: full visibility 3 km, thinning to 15 km; RUSI: FPV reach grew from 3 to 10 km by spring 2025; the Drone Line aimed for 10-15 km (Feb 2025); soft vehicles cannot operate within about 10 km (2025). min 3, mode 10, max 15."

- key: kill_zone_depth
  era: e8
  dist: {type: triangular, min: 10, mode: 15, max: 20}
  unit: km
  description: Drone-lethal band in the drone kill-zone era (both sides).
  derived_from: [05-0028-14, 01-0004-12, 01-0029-28, 01-0022-03]
  method: "Kyiv Independent/RUSI via 05's era table: about 10-20 km; 01: a 10-15 km kill zone formed on both sides in 2025; the Drone Line's 10-15 km target. Mode at 15 km where both overlap."

- key: road_interdiction_depth
