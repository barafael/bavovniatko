- id: pravda-2022-romaniuk-zmiinyi-battle
  title: "Battle for Zmiinyi (Snake) Island. Reconstructing the heroic tale of Ukraine losing and reclaiming the critical island"
  url: https://www.pravda.com.ua/eng/articles/2022/11/07/7375232/
  publisher: Ukrainska Pravda
  authors: [Roman Romaniuk]
  published: "2022-11-07"
  accessed: "2026-10-01"
  type: news
  origin: ukrainian
  reliability: medium
  verified: fetched
  eras: [e1-invasion, e2-donbas-artillery]
  topics: [naval, chapter, snake-island, prisoners, special-operations]
  found_in: [c02-snake-island-moskva]
  notes: "The fullest Ukrainian reconstruction of Act 1 and the coda. Interviews with border-post commander Bohdan Hotskyi give the 24 Feb timeline (03:00 radio intercept, 06:00 first surrender call, 09:00 threats, noon Moskva arrives, about 18:00 the reply) and the garrison (80: about 30 border guards, 40+ marines of the 35th Brigade). It also covers the Sapfir capture, the HUR-led 8-9 May helicopter assault, the 20 Jun Boiko-tower strikes, the 30 Jun barrage and the flag's return. Anonymous intelligence sources; some claims (TB2 distraction, P-8 coordinates) conflict with the same author's Dec 2022 piece."

