  type: news
  origin: ukrainian
  reliability: medium
  verified: fetched
  eras:
  - e1-invasion
  - e7-kursk-pokrovsk
  - e9-counteroffensive-26
  topics:
  - ew
  - russia
  - russian-ew
  - satcom-jamming
  - starlink
  notes: 'Blog by a satcom engineer (SkyLinker.io, a vendor). Russian anti-Starlink attempts in 2022–23 gave only minor local
    effects; purpose-built prototypes (''Peresvet'') appeared in 2024. Full denial would need about 95 dBW EIRP per satellite
    across 20–80 visible satellites, so Russian systems (tens of kW) only inject pulse interference: 0–35% packet loss inside
    an H3 level-5 cell (about 17 km across, 253 km2). Enough to break unhardened drone video/control, not to black out comms.
    Unmodified terminals are also vulnerable through their GNSS receiver.'
