- id: militarnyi-2026-stepanets-ew-vs-starlink
  title: 'EW vs Starlink: What Actually Works?'
  url: https://militarnyi.com/en/blogs/ew-vs-starlink-what-actually-works/
  publisher: Militarnyi
  authors:
  - Volodymyr Stepanets
