# Chapter → unit crosswalk for bavovniatko.
#
# Companion to design/units.md. Each entry lists the depicted systems for a chapter, using canonical
# registry ids (db/vocab/entities/system.yaml), including the 10 added on 2026-10-10. Formations/actors are not listed here: brigades
# are already linked to chapters through the dossier claims in the knowledge base.
#
# c07 Bakhmut, c09 Robotyne, c14 Kursk and c15 Pokrovsk were rebuilt on 2026-10-10 from the knowledge
# base: every `system` that a claim of the chapter's topic is `about`, minus techniques, software,
# programmes and satellites, with roles taken from those claims. Entries marked `basis: era` are not
# named in the dossier and come from the era loadouts in game-data/sim-20260930.json.
# Written 2026-10-02.

