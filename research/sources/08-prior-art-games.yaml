  url: https://warontherocks.com/2022/03/the-wargame-before-the-war-russia-attacks-ukraine/
  publisher: War on the Rocks
  authors: ["James Lacey", "Tim Barrick", "Nathan Barrick"]
  published: "2022-03-02"
  accessed: "2026-09-28"
  type: think-tank
  origin: western
  reliability: high
  verified: fetched
  eras: [e1-invasion]
  topics: [professional-wargaming, forecasting]
  notes: "Marine Corps University four-day game run two weeks before the invasion. It anticipated the Belarus axis on Kyiv, the Kherson push and converging axes. It diverged because the game had Russia first wreck air defences (Ukraine's air force died by day 3) and could not model Zelenskyy's leadership or Ukrainian morale. The value is 'terrain of possibility', not prediction."

