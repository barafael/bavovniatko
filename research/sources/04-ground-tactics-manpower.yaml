  eras:
  - e8-drone-kill-zone
  - e9-counteroffensive-26
  topics:
  - shelterbelts
  - tactics
  - terrain
  notes: 10-page report by a Ukrainian analyst and serving soldier, based on his own combat experience, UA officers and NCOs,
    and captured Russian tactical guidance (full PDF read). Belt grid 300-400 m apart one way and 1,000-2,000 m the other,
    3-4 tree rows, 10-30 m machinery gaps, rarely over 20-30 m wide. Longitudinal attack along the belt is the predominant
    method for both sides; perpendicular attack is rarely viable. Assault group 300-500 m deep (scouts 7-9 m apart, main body
    30 m behind, consolidation group 100-150 m, reserve up to 450 m). Approaches are timed to rain, fog, darkness and pre-dawn.
    Guns 8-12 km and mortars 2-3 km from the target belt. Avoid CPs at belt intersections. One author, so medium.
