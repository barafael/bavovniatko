  notes: 'Fieldwork-based reconstruction of the 24-25 Feb battle: ~34 helicopters and 200-300 VDV (31st GAAB, 45th Spetsnaz)
    from Bolshoy Bokov; border 09:30, spotted at the Kyiv HPP dam 10:30, at Hostomel 11:00, airfield secured 13:00; ~200 NGU
    4th Rapid Reaction Brigade defenders under Maj. Vitalii Rudenko; 18 Il-76 with ~1,000 troops aborted; counterattack at
    sunset (80th, 95th, 72nd, 3rd SSO), retaken by 21:00, runway cratered, Russians back on 25 Feb. Read via the WP JSON API
    (old dated URL now 404s).'
