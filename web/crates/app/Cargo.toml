[package]
name = "kbapp"
description = "The knowledge-base explorer (Leptos, client-side)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
leptos = { version = "0.8.21", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook = "0.1"
wasm-bindgen-futures.workspace = true
futures = "0.3"
web-sys = { workspace = true, features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "Window", "Location", "History", "HtmlTextAreaElement", "KeyboardEvent", "Response", "Navigator", "Clipboard"] }
